name: build
on: [push, pull_request]

jobs:
  kext:
    runs-on: macos-15
    strategy:
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v5
      - name: Bootstrap SDK
        run: sh scripts/bootstrap.sh
      - name: Build
        run: |
          if [ "${{ matrix.config }}" = "Debug" ]; then make DEBUG=1; else make; fi
      - name: Compile isolated Navi33 PCI metadata observer (do not load)
        run: |
          if [ "${{ matrix.config }}" = "Debug" ]; then make DEBUG=1 diag; else make diag; fi

      - name: Compile existing Navi33 P4/P5/P6 in isolated experimental bundle (never load)
        run: |
          if [ "${{ matrix.config }}" = "Debug" ]; then make DEBUG=1 navi33-p4; else make navi33-p4; fi

      - name: Compile firmware-enabled native call sites (no firmware linked)
        run: |
          if [ "${{ matrix.config }}" = "Debug" ]; then make DEBUG=1 check-kernel-firmware; else make check-kernel-firmware; fi
      - name: Compile PSP firmware-enabled P7/P7.1 path (declaration-only fixture)
        run: |
          if [ "${{ matrix.config }}" = "Debug" ]; then make DEBUG=1 check-kernel-psp-firmware; else make check-kernel-psp-firmware; fi
      - name: Compile actual AUTOLOAD_RLC unsafe-gated code path (syntax only, never load)
        run: |
          if [ "${{ matrix.config }}" = "Debug" ]; then make DEBUG=1 check-kernel-rlc-autoload; else make check-kernel-rlc-autoload; fi
      - name: Host tests (compat layer)
        if: matrix.config == 'Release'
        run: make test
      - uses: actions/upload-artifact@v5
        with:
          name: RedNavi-${{ matrix.config }}
          path: |
            build/${{ matrix.config }}/RedNavi.kext
            build/${{ matrix.config }}/RedNaviFB.kext
